<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connections</title>

<style>
body{
margin:0;
font-family:Arial;
background:#121213;
color:white;
text-align:center;
}

h1{
margin:10px;
font-size:22px;
position:relative;
}

#helpBtn{
position:absolute;
right:10px;
top:-5px;
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

#groups{max-width:420px;margin:auto;}

.groupRow{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:6px 10px;
}

#grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:10px;
max-width:420px;
margin:auto;
}

.tile{
height:60px;
display:flex;
align-items:center;
justify-content:center;
background:#3a3a3c;
border-radius:8px;
font-weight:bold;
font-size:15px;
}

.tile.selected{background:#b59f3b;}

.underline1{text-decoration: underline;}
.underline2{text-decoration: underline double;}
.underline3{text-decoration: underline wavy;}
.underline4{text-decoration: underline dotted;}

#controls{
display:flex;
justify-content:center;
gap:10px;
}

button{
margin-top:10px;
padding:12px 16px;
font-size:15px;
border:none;
border-radius:8px;
background:#565758;
color:white;
}

#nextBtn{display:none;background:#538d4e;}
#hintBtn{background:#3b6bb5;}

#overlay{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
}

#panel{
background:#1a1a1b;
padding:20px;
border-radius:12px;
width:85%;
max-width:320px;
text-align:left;
}

#panel button{
width:100%;
margin-top:10px;
}
</style>

</head>
<body>

<h1>
Connections
<button id="helpBtn">❓</button>
</h1>

<div id="groups"></div>
<div id="grid"></div>

<div id="controls">
<button id="hintBtn">Hinweis [3×]</button>
<button id="submitBtn">Gruppe prüfen</button>
<button id="nextBtn">Weiter</button>
</div>

<div id="info"></div>

<div id="overlay">
<div id="panel">
<h2 id="resultTitle"></h2>
<div id="stats"></div>
<button id="closeHelp">Schließen</button>
<button id="restartBtn">Neue Runde</button>
</div>
</div>

<script>

// ===== Farben =====
const difficultyColors={
easy:"#538d4e",
medium:"#b59f3b",
hard:"#b53b3b",
veryhard:"#6b3bb5"
}

// ===== VIELE KATEGORIEN =====
const categories=[

// 🟢 EASY
{name:"Früchte",difficulty:"easy",words:["APFEL","BIRNE","MANGO","TRAUBE","BANANE","PFIRSICH","KIRSCHE","MELONE"]},
{name:"Farben",difficulty:"easy",words:["ROT","BLAU","GRUEN","GELB","ORANGE","LILA","BRAUN","WEISS"]},
{name:"Tiere",difficulty:"easy",words:["TIGER","ZEBRA","PANDA","OTTER","WOLF","BISON","ADLER","FUCHS"]},
{name:"Gemüse",difficulty:"easy",words:["KAROTTE","TOMATE","GURKE","PAPRIKA","ZWIEBEL","SALAT","BROKKOLI","SPINAT"]},
{name:"Körperteile",difficulty:"easy",words:["HAND","FUSS","KOPF","AUGE","NASE","MUND","OHR","ARM"]},
  {name:"Getreide",difficulty:"easy",words:["WEIZEN","REIS","GERSTE","HAFER","HIRSE","MAIS","DINKEL","ROGGEN"]},
  {name:"Musikinstrumente",difficulty:"easy",words:["GITARRE","KLAVIER","TROMMEL","VIOLINE","FLÖTE","TRUMPETE","CELLO","SAXOPHON"]},

// 🟡 MEDIUM
{name:"Möbel",difficulty:"medium",words:["TISCH","STUHL","SOFA","BETT","SCHRANK","LAMPE","REGAL","HOCKER"]},
{name:"Fahrzeuge",difficulty:"medium",words:["AUTO","BUS","ZUG","RAD","BOOT","TRAM","TAXI","ROLLER"]},
{name:"Wetter",difficulty:"medium",words:["SONNE","REGEN","WIND","NEBEL","HAGEL","STURM","HITZE","FROST"]},
{name:"Getränke",difficulty:"medium",words:["KAFFEE","TEE","SAFT","WASSER","BIER","WEIN","COLA","FANTA"]},
{name:"Berufe",difficulty:"medium",words:["LEHRER","ARZT","INGENIEUR","POLIZIST","KOCH","PILOT","ANWALT","BAUER"]},
{name:"Schulfächer",difficulty:"medium",words:["MATHE","DEUTSCH","ENGLISCH","BIO","CHEMIE","PHYSIK","KUNST","SPORT"]},
  
  {name:"Sportarten",difficulty:"medium",words:["FUSSBALL","BASKETBALL","TENNIS","VOLLEYBALL","SCHWIMMEN","REITEN","BOXEN","RUGBY"]},
  {name:"Technische Geräte",difficulty:"medium",words:["HANDY","FERNSEHER","RADIO","KAMERA","LAPTOP","TABLET","DRUCKER","MONITOR"]},


// 🔴 HARD
{name:"Verben",difficulty:"hard",words:["LAUFEN","SPRINGEN","SPRECHEN","JAGEN","SINGEN","ARBEITEN","HELFEN","RIECHEN"]},
{name:"Gefühle",difficulty:"hard",words:["ANGST","FREUDE","WUT","LIEBE","TRAUER","NEID","STOLZ","SCHAM"]},
{name:"Materialien",difficulty:"hard",words:["HOLZ","METALL","GLAS","PLASTIK","PAPIER","STEIN","LEDER","STOFF"]},
{name:"Technik",difficulty:"hard",words:["CPU","RAM","SSD","GPU","SERVER","ROUTER","MODEM","KABEL"]},
  {name:"Kann man öffnen",difficulty:"hard",words:["TÜR","FENSTER","BUCH","APP","GESPRÄCH","FLASCHE","DATEI","TOR"]},
  {name:"Wörter mit '-ug'",difficulty:"hard",words:["ANZUG","ZUG","BETRUG","KLUG","ZEUG","TRUG","FLUG"]},
  {name:"Mythologische Figuren",difficulty:"hard",words:["ZEUS","HERA","ODIN","THOR","LOKI","ATHENA","POSEIDON","ARTEMIS"]},

  
// 🟣 VERY HARD
{name:"Doppelbedeutung",difficulty:"veryhard",words:["SCHLOSS","BANK","STROM","ARM","ZUG","LEITER","DECKE","KURS"]},
{name:"Endung -ER",difficulty:"veryhard",words:["SPIELER","FAHRER","LEHRER","BAUER","ARBEITER","SÄNGER","TÄNZER","MALER"]},
{name:"Palindrom",difficulty:"veryhard",words:["OTTO","ANNA","LEVEL","RADAR","LAGERREGAL","NEBEN"]},
  {name:"Mit '-Spiel'",difficulty:"veryhard",words:["KARTEN","SCHATTEN","KINDER","ROLLEN","BRETT","GLÜCK","VIDEO","WORT"]},
  {name:"Kann man brechen",difficulty:"veryhard",words:["HERZ","REKORD","REGEL","GLAS","SCHWEIGEN","EI","ARM","VERSPRECHEN"]},
  {name:"Wörter mit 'Hand-'",difficulty:"veryhard",words:["SCHUH","WERK","BALL","TUCH","SCHRIFT","GRIFF","SPIEL","WERKZEUG"]},
  {name:"Mathematische Begriffe",difficulty:"veryhard",words:["INTEGRAL","ABLEITUNG","VEKTOR","MATRIX","FUNKTION","KOMPLEX","GRAD","WURZEL"]},
  {name:"Chemische Elemente",difficulty:"veryhard",words:["WASSERSTOFF","Sauerstoff","NITROGEN","KOHLENSTOFF","NEON","EISEN","KUPFER","ZINK"]},
  
]

// ===== GAME LOGIK bleibt gleich =====
let gameCats=[]
let words=[]
let selected=[]
let solved=0
let mistakes=0
let hints=3
let hintMode=false
let hintMarks=[]

startGame()

function startGame(){
gameCats=[...categories].sort(()=>Math.random()-0.5).slice(0,4)
words=[]
gameCats.forEach(c=>{
let sel=[...c.words].sort(()=>Math.random()-0.5).slice(0,4)
c.roundWords=sel
words.push(...sel)
})
words=words.sort(()=>Math.random()-0.5)
drawGrid()
updateHintBtn()
}

function drawGrid(){
const grid=document.gtElementById("grid")
grid.innerHTML=""
words.forEach(word=>{
let tile=document.createElement("div")
tile.className="tile"
tile.innerText=word

hintMarks.forEach(h=>{
if(h.words.includes(word)){
tile.classList.add("underline"+h.level)
}
})

tile.onclick=()=>{
if(hintMode){useHint(word);return}
selectTile(tile,word)
}

grid.appendChild(tile)
})
}

function selectTile(tile,word){
if(tile.classList.contains("selected")){
tile.classList.remove("selected")
selected=selected.filter(w=>w!==word)
return
}
if(selected.length<4){
tile.classList.add("selected")
selected.push(word)
}
}

document.getElementById("hintBtn").onclick = () => {
  if(hints <= 0){
    hintMode = false;
    document.getElementById("hintBtn").style.background = "#3b6bb5"; // normal zurück
    return;
  }
  hintMode = !hintMode; // toggle
  document.getElementById("hintBtn").style.background = hintMode ? "#b59f3b" : "#3b6bb5"; // gelb wenn aktiv
}

function useHint(word){
let cat=gameCats.find(c=>c.roundWords.includes(word))
let other=cat.roundWords.find(w=>w!==word)
let level=gameCats.indexOf(cat)+1
hintMarks.push({words:[word,other],level})
drawGrid()
hints--
hintMode = false;
document.getElementById("hintBtn").style.background = "#3b6bb5"; // wieder normal
updateHintBtn()
}

function updateHintBtn(){
document.getElementById("hintBtn").innerText=`Hinweis [${hints}×]`
}

document.getElementById("submitBtn").onclick=checkGroup

function checkGroup(){
if(selected.length!==4)return
for(let cat of gameCats){
if(selected.every(w=>cat.roundWords.includes(w))){
createGroup(cat)
words=words.filter(w=>!cat.roundWords.includes(w))
selected=[]
solved++
hints++
drawGrid()
updateHintBtn()
checkWin()
return
}}
mistakes++
selected=[]
document.querySelectorAll(".selected").forEach(t=>t.classList.remove("selected"))
if(mistakes>=4)lose()
}

function createGroup(cat){
const container=document.createElement("div")
const title=document.createElement("div")
title.innerText=cat.name
title.style.color=difficultyColors[cat.difficulty]
const row=document.createElement("div")
row.className="groupRow"
cat.roundWords.forEach(w=>{
let tile=document.createElement("div")
tile.className="tile"
tile.innerText=w
tile.style.background=difficultyColors[cat.difficulty]
row.appendChild(tile)
})
container.appendChild(title)
container.appendChild(row)
document.getElementById("groups").appendChild(container)
}

function lose(){
gameCats.forEach(cat=>{
if(!document.body.innerText.includes(cat.name)){
createGroup(cat)
}
})
document.getElementById("grid").innerHTML=""
document.getElementById("submitBtn").style.display="none"
document.getElementById("nextBtn").style.display="inline-block"
}

function checkWin(){
if(solved===4){
document.getElementById("nextBtn").style.display="inline-block"
}
}


  document.getElementById("nextBtn").onclick=()=>{
location.reload()
  }

document.getElementById("helpBtn").onclick=()=>{
document.getElementById("overlay").style.display="flex"
document.getElementById("resultTitle").innerText="Anleitung"
document.getElementById("stats").innerHTML="Finde Gruppen aus 4 passenden Wörtern."
}

document.getElementById("closeHelp").onclick=()=>{
document.getElementById("overlay").style.display="none"
}

document.getElementById("restartBtn").onclick=()=>location.reload()

</script>

</body>
</html>
