<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connections</title>

<style>

body{
margin:0;
font-family:Arial;
background:#121213;
color:white;
text-align:center;
}

h1{
margin:10px;
font-size:22px;
}

#groups{
max-width:420px;
margin:auto;
}

.groupRow{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:6px 10px;
}

#grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:10px;
max-width:420px;
margin:auto;
}

.tile{
height:60px;
display:flex;
align-items:center;
justify-content:center;
background:#3a3a3c;
border-radius:8px;
font-weight:bold;
font-size:15px;
}

.tile.selected{
background:#b59f3b;
}

#submitBtn, #nextBtn{
margin-top:10px;
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#565758;
color:white;
}

#nextBtn{
display:none;
background:#538d4e;
}

#info{
margin-top:10px;
font-size:15px;
}

#overlay{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
}

#panel{
background:#1a1a1b;
padding:25px;
border-radius:12px;
width:80%;
max-width:300px;
}

#panel button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#538d4e;
color:white;
}

</style>

</head>
<body>

<h1>Connections</h1>

<div id="groups"></div>
<div id="grid"></div>

<button id="submitBtn">Gruppe prüfen</button>
<button id="nextBtn">Weiter</button>

<div id="info"></div>

<div id="overlay">
<div id="panel">
<h2 id="resultTitle"></h2>
<div id="stats"></div>
<button id="restartBtn">Neue Runde</button>
</div>
</div>

<script>

// ================== SCHWIERIGKEIT ==================

const difficultyColors={
easy:"#538d4e",
medium:"#b59f3b",
hard:"#b53b3b",
veryhard:"#6b3bb5"
}

// ================== ALLE KATEGORIEN ==================

const categories=[

// EASY
{name:"Früchte",difficulty:"easy",words:["APFEL","BIRNE","MANGO","TRAUBE","BANANE","PFIRSICH","KIRSCHE","MELONE"]},
{name:"Farben",difficulty:"easy",words:["ROT","BLAU","GRUEN","GELB","ORANGE","LILA","BRAUN","WEISS"]},
{name:"Tiere",difficulty:"easy",words:["TIGER","ZEBRA","PANDA","OTTER","WOLF","BISON","ADLER","FUCHS"]},

// MEDIUM
{name:"Möbel",difficulty:"medium",words:["TISCH","STUHL","SOFA","BETT","SCHRANK","LAMPE","REGAL","HOCKER"]},
{name:"Fahrzeuge",difficulty:"medium",words:["AUTO","BUS","ZUG","RAD","BOOT","TRAM","TAXI","ROLLER"]},
{name:"Wetter",difficulty:"medium",words:["SONNE","REGEN","WIND","NEBEL","HAGEL","STURM","HITZE","FROST"]},
{name:"Getränke",difficulty:"medium",words:["KAFFEE","TEE","SAFT","WASSER","BIER","WEIN","COLA","FANTA"]},
{name:"Jobs",difficulty:"medium",words:["LEHRER","ARZT","INGENIEUR","POLIZIST","KOCH","PILOT","ANWALT","BAUER"]},

// HARD
{name:"Verben",difficulty:"hard",words:["LAUFEN","SPRINGEN","SPRECHEN","JAGEN","SINGEN","ARBEITEN","HELFEN","RIECHEN"]},
{name:"Musikgenres",difficulty:"hard",words:["ROCK","POP","JAZZ","KLASSIK","HIPHOP","ELEKTRONIK","FOLK","METAL"]},
{name:"Fabelwesen",difficulty:"hard",words:["DRACHE","EINHORN","PHOENIX","ZENTAUR","MINOTAURUS","GRIFFIN","MERMAID","WERWOLF"]},
{name:"Wörter mit '-ug'",difficulty:"hard",words:["ANZUG","ZUG","BETRUG","KLUG","ZEUG","TRUG","FLUG"]},
{name:"Kann man öffnen",difficulty:"hard",words:["TÜR","FENSTER","BUCH","APP","GESPRÄCH","FLASCHE","DATEI","TOR"]},

// VERY HARD
{name:"Hat einen Kopf",difficulty:"veryhard",words:["NAGEL","MENSCH","SALAT","BIER","SCHRAUBE","ZUG","MÜNZE","HAMMER"]},
{name:"Mit Doppelbedeutung",difficulty:"veryhard",words:["SCHLOSS","BANK","STROM","ARM","ZUG","LEITER","DECKE","KURS"]},
{name:"Kann laufen",difficulty:"veryhard",words:["WASSER","NASE","UHR","MOTOR","PROGRAMM","ZEIT","FARBE","AKKU"]},
{name:"Wörter mit 'Hand-'",difficulty:"veryhard",words:["SCHUH","WERK","BALL","TUCH","SCHRIFT","GRIFF","SPIEL","WERKZEUG"]},
{name:"Kann man brechen",difficulty:"veryhard",words:["HERZ","REKORD","REGEL","GLAS","SCHWEIGEN","EI","ARM","VERSPRECHEN"]},
{name:"Ist unsichtbar",difficulty:"veryhard",words:["LUFT","WIND","ZEIT","GEDANKE","GEFÜHL","STRAHLUNG","KRAFT","SEELE"]},
{name:"Mit '-Spiel'",difficulty:"veryhard",words:["KARTEN","SCHATTEN","KINDER","ROLLEN","BRETT","GLÜCK","VIDEO","WORT"]}

]

// ================== REST = (gleich wie vorher) ==================

let gameCats=[]
let words=[]
let selected=[]
let mistakes=0
let solved=0

let startTime
let attempts=0

let bestTime=localStorage.getItem("bestTime")
let totalWins=localStorage.getItem("totalWins") || 0
let totalGames=localStorage.getItem("totalGames") || 0

startGame()

function startGame(){

startTime=Date.now()
attempts=0
mistakes=0
solved=0

gameCats=[...categories].sort(()=>Math.random()-0.5).slice(0,4)

words=[]

gameCats.forEach(c=>{
let selectedWords=[...c.words].sort(()=>Math.random()-0.5).slice(0,4)
c.roundWords=selectedWords
words.push(...selectedWords)
})

words=words.sort(()=>Math.random()-0.5)

drawGrid()
updateInfo()
}

function drawGrid(){
const grid=document.getElementById("grid")
grid.innerHTML=""

words.forEach(word=>{
let tile=document.createElement("div")
tile.className="tile"
tile.innerText=word
tile.onclick=()=>selectTile(tile,word)
grid.appendChild(tile)
})
}

function selectTile(tile,word){

if(tile.classList.contains("selected")){
tile.classList.remove("selected")
selected=selected.filter(w=>w!==word)
return
}

if(selected.length<4){
tile.classList.add("selected")
selected.push(word)
}
}

document.getElementById("submitBtn").onclick=checkGroup

function checkGroup(){

if(selected.length!==4) return

attempts++

for(let cat of gameCats){

if(selected.every(w=>cat.roundWords.includes(w))){

createGroup(cat)

words=words.filter(w=>!cat.roundWords.includes(w))

selected=[]
solved++

drawGrid()
updateInfo()
checkWin()

return
}
}

mistakes++

selected=[]
document.querySelectorAll(".selected").forEach(t=>t.classList.remove("selected"))

updateInfo()

if(mistakes>=4) lose()
}

function createGroup(cat){

const container=document.createElement("div")

const title=document.createElement("div")
title.innerText=cat.name
title.style.fontWeight="bold"
title.style.margin="10px 0 4px 0"
title.style.color = difficultyColors[cat.difficulty]

const row=document.createElement("div")
row.className="groupRow"

cat.roundWords.forEach(w=>{
let tile=document.createElement("div")
tile.className="tile"
tile.innerText=w
tile.style.background = difficultyColors[cat.difficulty]
row.appendChild(tile)
})

container.appendChild(title)
container.appendChild(row)

document.getElementById("groups").appendChild(container)
}

function updateInfo(){
document.getElementById("info").innerText=
"Fehler "+mistakes+" / 4 | Versuche: "+attempts
}

function checkWin(){
if(solved===4){
document.getElementById("nextBtn").style.display="inline-block"
}
}

document.getElementById("nextBtn").onclick=function(){

let time=Math.floor((Date.now()-startTime)/1000)

totalGames++
totalWins++

if(!bestTime || time < bestTime){
bestTime=time
localStorage.setItem("bestTime",time)
}

localStorage.setItem("totalWins",totalWins)
localStorage.setItem("totalGames",totalGames)

showPanel("Gewonnen", time)
}

function lose(){

totalGames++
localStorage.setItem("totalGames",totalGames)

gameCats.forEach(cat=>{
createGroup(cat)
})

document.getElementById("grid").innerHTML=""
document.getElementById("submitBtn").style.display="none"

showPanel("Verloren")
}

function showPanel(title, time=0){

document.getElementById("resultTitle").innerText=title

let text=""

if(title==="Gewonnen"){
text+=`Zeit: ${time}s<br>`
text+=`Versuche: ${attempts}<br>`
}

text+=`Beste Zeit: ${bestTime || "-"}s<br>`
text+=`Spiele: ${totalGames}<br>`
text+=`Siege: ${totalWins}`

document.getElementById("stats").innerHTML=text

document.getElementById("overlay").style.display="flex"
}

document.getElementById("restartBtn").onclick=function(){
location.reload()
}

</script>

</body>
</html>
